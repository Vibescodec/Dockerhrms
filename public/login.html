<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Docker HRMS</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/api/logo">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" id="login-card" aria-labelledby="login-title">
      <img class="login-logo" src="/api/logo" alt="Docker HRMS logo">
      <h1 id="login-title">Sign in</h1>
      <p class="login-sub" id="login-company">Docker HRMS</p>

      <form id="login-form" novalidate>
        <label class="field" id="username-field">
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required autofocus>
        </label>

        <label class="field" id="password-field">
          <span>Password</span>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="ghost-icon" id="toggle-password" aria-label="Show password" aria-pressed="false">
              <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="m3 3 18 18"></path>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.4 3.3"></path>
                <path d="M6.6 6.7A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.9-1.2"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </label>

        <p class="form-error" id="login-error" role="alert" hidden></p>

        <button class="btn btn-primary btn-block" id="login-button" type="submit">Sign in</button>
      </form>

      <p class="login-foot">Internal system · Authorised staff only</p>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
